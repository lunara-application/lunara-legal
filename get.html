<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get Lunara</title>
  <meta name="description" content="Get Lunara for iPhone or Android.">
  <script>
    // Send phones straight to their own store. Runs before the page paints, so
    // most visitors never see this page at all. replace() rather than a normal
    // navigation, so the back button does not land here and bounce them again.
    (function () {
      var APP_STORE = 'https://apps.apple.com/app/id6784858281';
      var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.getlunara.app';
      var ua = navigator.userAgent || '';
      // iPadOS 13 and later reports a Mac user agent by default; a Mac with a
      // touch screen is how an iPad gives itself away.
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
        (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      var target = isIOS ? APP_STORE : isAndroid ? PLAY_STORE : null;
      if (target) {
        document.documentElement.className = 'redirecting';
        window.location.replace(target);
      }
    })();
  </script>
  <style>
    :root {
      --bg: #F6F2EC;
      --card: #FBF8F3;
      --text: #1F1B17;
      --muted: #7A7168;
      --accent: #A86E50;
      --border: #E7E0D6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1A1714;
        --card: #24201C;
        --text: #F2ECE4;
        --muted: #B3A99E;
        --accent: #D08F6E;
        --border: #3A332C;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 17px;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 20px 64px;
    }
    .eyebrow {
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0 0 8px;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 600;
      line-height: 1.2;
      font-size: 32px;
      margin: 0 0 12px;
    }
    p { margin: 0 0 16px; }
    .lede { color: var(--muted); }
    .stores {
      display: grid;
      gap: 12px;
      margin: 28px 0 0;
    }
    .store {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 22px;
      color: var(--text);
      text-decoration: none;
    }
    .store:hover, .store:focus-visible { border-color: var(--accent); }
    .store strong { display: block; font-size: 17px; }
    .store span { color: var(--muted); font-size: 15px; }
    .opening { display: none; color: var(--muted); }
    /* A phone is already on its way to the store. Say so rather than show a
       choice it no longer needs to make; the links stay as a fallback. */
    .redirecting .opening { display: block; }
    footer {
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Lunara</p>
    <h1>Get Lunara</h1>
    <p class="opening">Opening your app store&hellip;</p>
    <p class="lede">
      A daily journal with a guide to the stars. Choose your store to download it.
    </p>

    <div class="stores">
      <a class="store" href="https://apps.apple.com/app/id6784858281">
        <strong>App Store</strong>
        <span>For iPhone</span>
      </a>
      <a class="store" href="https://play.google.com/store/apps/details?id=com.getlunara.app">
        <strong>Google Play</strong>
        <span>For Android</span>
      </a>
    </div>

    <footer>
      <p style="margin: 0;">
        <a href="./">Privacy Policy</a>
      </p>
    </footer>
  </main>
</body>
</html>
